[package]
name = "scriptfx"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
analysis = { version = "0.1.0", path = "../analysis" }
dirs = "7.0.0"
dsp = { version = "0.1.0", path = "../dsp" }
egui_glow = { version = "0.31", default-features = false }
hound = "3.5.1"
include_dir = "0.7.4"
naga = { version = "30", features = ["wgsl-in", "glsl-out"] }
nih_plug = { path = "../../vendor/nih-plug", features = ["standalone", "assert_process_allocs"] }
nih_plug_egui = { path = "../../vendor/nih-plug/nih_plug_egui" }
patch = { version = "0.1.0", path = "../patch" }
rtrb = "0.4.1"
serde_json = "1.0.154"
ui-components = { version = "0.1.0", path = "../ui-components" }

[lib]
crate-type = ["cdylib", "lib"]
