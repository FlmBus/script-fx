<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="stop-bg2"/>
      <stop offset="1" class="stop-bg"/>
    </linearGradient>
    <radialGradient id="knob" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" class="stop-edge"/>
      <stop offset="1" class="stop-panel"/>
    </radialGradient>
    <linearGradient id="meter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" class="stop-cool"/>
      <stop offset="0.75" class="stop-accent"/>
      <stop offset="1" class="stop-hot"/>
    </linearGradient>
  </defs>

  <rect width="760" height="400" fill="url(#bg)"/>
  <rect x="8" y="8" width="744" height="384" rx="14" fill="none" class="stroke-edge" stroke-width="1.5"/>
  <g font-family="sans-serif">
    <text x="28" y="40" class="fill-text" font-size="20" font-weight="bold" letter-spacing="4">BASS HELPER</text>
    <text x="214" y="40" class="fill-dim" font-size="10" letter-spacing="2">PUNCH · FET · OPTO · SPLIT (RIDE / GRIT) · EQ</text>
  </g>

  <!-- signal flow strip -->
  <g font-family="sans-serif" font-size="10" letter-spacing="1.5" text-anchor="middle">
    <g class="stroke-dim" stroke-width="1.5" fill="none">
      <path d="M 20 92 L 40 92"/><path d="M 120 92 L 140 92"/><path d="M 210 92 L 230 92"/>
      <path d="M 300 92 L 316 92 L 316 74 L 330 74"/><path d="M 316 92 L 316 110 L 330 110"/>
      <path d="M 450 74 L 466 74 L 466 92 L 480 92"/><path d="M 450 110 L 466 110 L 466 92"/>
      <path d="M 560 92 L 580 92"/><path d="M 620 92 L 640 92"/>
    </g>

    <rect x="40" y="70" width="80" height="44" rx="6" class="fill-panel stroke-edge"/>
    <text x="80" y="88" class="fill-text">PUNCH</text>
    <rect x="48" y="100" width="64" height="4" rx="2" class="fill-bg"/>
    <rect x="79" y="98" width="2" height="8" class="fill-dim"/>
    <rect id="punch_mark" x="78" y="97" width="4" height="10" rx="1" class="fill-accent"/>

    <rect x="140" y="70" width="70" height="44" rx="6" class="fill-panel stroke-edge"/>
    <text x="175" y="88" class="fill-text">FET</text>
    <rect x="148" y="100" width="54" height="4" rx="2" class="fill-bg"/>
    <rect id="fet_bar" x="148" y="100" width="54" height="4" rx="2" class="fill-hot"/>

    <rect x="230" y="70" width="70" height="44" rx="6" class="fill-panel stroke-edge"/>
    <text x="265" y="88" class="fill-text">OPTO</text>
    <rect x="238" y="100" width="54" height="4" rx="2" class="fill-bg"/>
    <rect id="opto_bar" x="238" y="100" width="54" height="4" rx="2" class="fill-hot"/>

    <rect x="330" y="58" width="120" height="32" rx="6" class="fill-panel stroke-edge"/>
    <text x="364" y="72" class="fill-cool">LOW</text>
    <text x="414" y="72" class="fill-text">RIDE</text>
    <rect x="350" y="79" width="80" height="4" rx="2" class="fill-bg"/>
    <rect x="389" y="77" width="2" height="8" class="fill-dim"/>
    <rect id="rider_mark" x="388" y="76" width="4" height="10" rx="1" class="fill-cool"/>

    <rect x="330" y="94" width="120" height="32" rx="6" class="fill-panel stroke-edge"/>
    <rect id="grit_glow" x="330" y="94" width="120" height="32" rx="6" class="fill-hot" opacity="0"/>
    <text x="364" y="114" class="fill-accent">HIGH</text>
    <text x="414" y="114" class="fill-text">GRIT</text>

    <rect x="480" y="70" width="80" height="44" rx="6" class="fill-panel stroke-edge"/>
    <text x="520" y="96" class="fill-text">EQ</text>
    <rect x="580" y="70" width="40" height="44" rx="6" class="fill-panel stroke-edge"/>
    <text x="600" y="96" class="fill-text">OUT</text>
  </g>

  <!-- big macro knobs -->
  <g font-family="sans-serif" text-anchor="middle">
    <text x="120" y="172" class="fill-dim" font-size="11" letter-spacing="2">TRANSIENTS</text>
    <circle cx="120" cy="222" r="46" fill="none" class="stroke-panel" stroke-width="3" stroke-dasharray="4 4"/>
    <circle id="transients_knob" cx="120" cy="222" r="38" fill="url(#knob)" class="stroke-edge" stroke-width="2"/>
    <g id="transients_ptr"><path d="M 120 208 L 120 191" class="stroke-accent" stroke-width="4" stroke-linecap="round"/></g>
    <text id="transients_val" x="120" y="290" class="fill-text" font-size="14">0%</text>

    <text x="270" y="172" class="fill-dim" font-size="11" letter-spacing="2">STABILIZE</text>
    <circle cx="270" cy="222" r="46" fill="none" class="stroke-panel" stroke-width="3" stroke-dasharray="4 4"/>
    <circle id="stabilize_knob" cx="270" cy="222" r="38" fill="url(#knob)" class="stroke-edge" stroke-width="2"/>
    <g id="stabilize_ptr"><path d="M 270 208 L 270 191" class="stroke-accent" stroke-width="4" stroke-linecap="round"/></g>
    <text id="stabilize_val" x="270" y="290" class="fill-text" font-size="14">0%</text>

    <text x="420" y="172" class="fill-dim" font-size="11" letter-spacing="2">DRIVE</text>
    <circle cx="420" cy="222" r="46" fill="none" class="stroke-panel" stroke-width="3" stroke-dasharray="4 4"/>
    <circle id="drive_knob" cx="420" cy="222" r="38" fill="url(#knob)" class="stroke-edge" stroke-width="2"/>
    <g id="drive_ptr"><path d="M 420 208 L 420 191" class="stroke-hot" stroke-width="4" stroke-linecap="round"/></g>
    <text id="drive_val" x="420" y="290" class="fill-text" font-size="14">0%</text>
  </g>

  <!-- tone + utility knobs -->
  <g font-family="sans-serif" text-anchor="middle" font-size="10">
    <text x="150" y="314" class="fill-dim" letter-spacing="2">TONE</text>
    <path d="M 60 318 L 120 318 M 180 318 L 240 318" class="stroke-panel" stroke-width="1"/>

    <text x="70" y="334" class="fill-dim" letter-spacing="1.5">BOOM</text>
    <circle id="boom_knob" cx="70" cy="356" r="17" fill="url(#knob)" class="stroke-edge" stroke-width="1.5"/>
    <g id="boom_ptr"><path d="M 70 350 L 70 342" class="stroke-cool" stroke-width="2.5" stroke-linecap="round"/></g>
    <text id="boom_val" x="70" y="388" class="fill-text">0</text>

    <text x="150" y="334" class="fill-dim" letter-spacing="1.5">BOXY</text>
    <circle id="boxy_knob" cx="150" cy="356" r="17" fill="url(#knob)" class="stroke-edge" stroke-width="1.5"/>
    <g id="boxy_ptr"><path d="M 150 350 L 150 342" class="stroke-cool" stroke-width="2.5" stroke-linecap="round"/></g>
    <text id="boxy_val" x="150" y="388" class="fill-text">0</text>

    <text x="230" y="334" class="fill-dim" letter-spacing="1.5">CLICK</text>
    <circle id="click_knob" cx="230" cy="356" r="17" fill="url(#knob)" class="stroke-edge" stroke-width="1.5"/>
    <g id="click_ptr"><path d="M 230 350 L 230 342" class="stroke-cool" stroke-width="2.5" stroke-linecap="round"/></g>
    <text id="click_val" x="230" y="388" class="fill-text">0</text>

    <text x="340" y="334" class="fill-dim" letter-spacing="1.5">X-OVER</text>
    <circle id="xover_knob" cx="340" cy="356" r="17" fill="url(#knob)" class="stroke-edge" stroke-width="1.5"/>
    <g id="xover_ptr"><path d="M 340 350 L 340 342" class="stroke-text" stroke-width="2.5" stroke-linecap="round"/></g>
    <text id="xover_val" x="340" y="388" class="fill-text">0</text>

    <text x="420" y="334" class="fill-dim" letter-spacing="1.5">OUTPUT</text>
    <circle id="out_knob" cx="420" cy="356" r="17" fill="url(#knob)" class="stroke-edge" stroke-width="1.5"/>
    <g id="out_ptr"><path d="M 420 350 L 420 342" class="stroke-text" stroke-width="2.5" stroke-linecap="round"/></g>
    <text id="out_val" x="420" y="388" class="fill-text">0</text>
  </g>

  <!-- right side: description + meters -->
  <g font-family="sans-serif" font-size="9" class="fill-dim">
    <text x="500" y="172" class="fill-text" letter-spacing="1">TRANSIENTS</text>
    <text x="500" y="185">punch shaper + FET attack</text>
    <text x="500" y="206" class="fill-text" letter-spacing="1">STABILIZE</text>
    <text x="500" y="219">FET + opto + low-band riding</text>
    <text x="500" y="240" class="fill-text" letter-spacing="1">DRIVE</text>
    <text x="500" y="253">grit on the high band only</text>
    <text x="500" y="274" class="fill-text" letter-spacing="1">X-OVER</text>
    <text x="500" y="287">low / high split point</text>
  </g>
  <g font-family="sans-serif" font-size="9" text-anchor="middle" class="fill-dim">
    <rect x="660" y="152" width="18" height="200" rx="3" class="fill-panel"/>
    <rect id="in_bar" x="660" y="152" width="18" height="200" rx="3" fill="url(#meter)"/>
    <text x="669" y="368">IN</text>
    <rect x="692" y="152" width="18" height="200" rx="3" class="fill-panel"/>
    <rect id="out_bar" x="692" y="152" width="18" height="200" rx="3" fill="url(#meter)"/>
    <text x="701" y="368">OUT</text>
  </g>
</svg>
