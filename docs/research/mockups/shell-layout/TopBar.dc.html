<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 984px; height: 40px; position: relative; background: #0b0b0c; font-family: Inter, system-ui, sans-serif; color: #f4f4f5; display: flex; align-items: center; padding: 0 12px; box-sizing: border-box; gap: 8px; justify-content: center">
  <!-- left: wordmark · library · patch (snapshots live in the notch, the view switch on the stage) -->
  <span style="font: 600 13px Inter; letter-spacing: 0.2px; padding: 0 6px 0 4px">ScriptFX</span><span style="width: 1px; height: 18px; background: rgba(255,255,255,0.12)"></span><button style="height: 28px; display: flex; align-items: center; gap: 6px; border: 0; border-radius: 8px; background: {{libBg}}; color: {{libInk}}; font: 500 12px Inter; padding: 0 10px" aria-label="Patch library">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h12"></path></svg>
    Patches
  </button>
  <div style="height: 28px; display: flex; align-items: center; background: rgba(255,255,255,0.05); border-radius: 8px; padding: 0 4px 0 10px; gap: 6px">
    <span style="font: 600 12px Inter">{{patch}}</span>
    <button style="width: 24px; height: 22px; border: 0; border-radius: 6px; background: none; color: #9b9ba3; display: flex; align-items: center; justify-content: center; padding: 0; position: relative" aria-label="Reload the patch file (in sync)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg>
      <span style="position: absolute; right: 2px; top: 2px; width: 5px; height: 5px; border-radius: 3px; background: #4ade80"></span>
    </button>
  </div>

  <span style="flex: 1"></span>

  <!-- chat · settings -->
  <button style="height: 28px; display: flex; align-items: center; gap: 6px; border: 0; border-radius: 8px; background: {{chatBg}}; color: {{chatInk}}; font: 500 12px Inter; padding: 0 10px" aria-label="Chat">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
    Chat
  </button>
  <button style="width: 28px; height: 28px; border: 0; border-radius: 8px; background: none; color: #d4d4d8; display: flex; align-items: center; justify-content: center; padding: 0" aria-label="Settings">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>
  </button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"patch":{"editor":null,"default":"Tape Glow"},"open":{"editor":null,"default":""},"$preview":{"width":984,"height":40}}'>
class Component extends DCLogic {
  renderVals() {
    const open = this.props.open ?? '';
    return {
      patch: this.props.patch ?? 'Tape Glow',
      libBg: open === 'library' ? '#f4f4f5' : 'transparent',
      libInk: open === 'library' ? '#0b0b0c' : '#d4d4d8',
      chatBg: open === 'chat' ? '#f4f4f5' : 'transparent',
      chatInk: open === 'chat' ? '#0b0b0c' : '#d4d4d8',
    };
  }
}
</script>
</body>
</html>
