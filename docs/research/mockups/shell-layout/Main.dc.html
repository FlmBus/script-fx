<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Surface with the mod dock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@1,600&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 984px; height: 708px; position: relative; overflow: hidden; background: #0b0b0c; font-family: Inter, system-ui, sans-serif; color: #f4f4f5">
  <div style="position: absolute; left: 0; top: 0">
    <dc-import name="TopBar" active="Surface" hint-size="984px,40px"></dc-import>
  </div>
  <!-- the stage: the patch's ControlPanel, never covered -->
  <div style="position: absolute; left: 12px; top: 44px">
    <dc-import name="PatchArt" hint-size="960px,540px"></dc-import>
  </div>
  <!-- the notch: snapshots, one row, hanging from the top bar -->
  <div style="position: absolute; left: 362px; top: 44px">
    <dc-import name="Notch" hint-size="260px,36px"></dc-import>
  </div>
  <!-- the view switch: icons, floating in the stage's top-right corner -->
  <div style="position: absolute; left: 864px; top: 54px">
    <dc-import name="ViewTabs" active="Surface" hint-size="98px,34px"></dc-import>
  </div>
  <!-- the mod dock: always there, below the stage -->
  <div style="position: absolute; left: 12px; top: 592px">
    <dc-import name="Dock" selected="" hint-size="960px,108px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":984,"height":708}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
