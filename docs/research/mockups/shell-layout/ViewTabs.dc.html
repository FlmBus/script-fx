<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>View switch</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<!-- Surface · Chain · Matrix as icons, floating on the stage's top-right corner (a label on hover) -->
<div style="width: 98px; height: 34px; box-sizing: border-box; padding: 3px; display: flex; gap: 2px; background: #0b0b0c; border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,0.3); color: #d4d4d8">
  <button title="Surface" aria-label="Surface" style="width: 30px; height: 26px; border: 0; border-radius: 7px; background: {{s.bg}}; color: {{s.ink}}; display: flex; align-items: center; justify-content: center; padding: 0">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="13" r="2.5"/><circle cx="15.5" cy="13" r="2.5"/></svg>
  </button>
  <button title="Chain" aria-label="Chain" style="width: 30px; height: 26px; border: 0; border-radius: 7px; background: {{c.bg}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center; padding: 0">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="9" width="6" height="6" rx="1.5"/><rect x="16" y="9" width="6" height="6" rx="1.5"/><path d="M8 12h8"/></svg>
  </button>
  <button title="Matrix" aria-label="Matrix" style="width: 30px; height: 26px; border: 0; border-radius: 7px; background: {{m.bg}}; color: {{m.ink}}; display: flex; align-items: center; justify-content: center; padding: 0">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18M9 3v18"/></svg>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["Surface","Chain","Matrix"],"default":"Surface"},"$preview":{"width":98,"height":34}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'Surface';
    const look = (v) => (v === active ? { bg: '#f4f4f5', ink: '#0b0b0c' } : { bg: 'transparent', ink: '#d4d4d8' });
    return { s: look('Surface'), c: look('Chain'), m: look('Matrix') };
  }
}
</script>
</body>
</html>
