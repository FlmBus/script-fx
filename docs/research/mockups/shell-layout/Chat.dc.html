<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat docked beside the stage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 984px; height: 708px; position: relative; overflow: hidden; background: #0b0b0c; font-family: Inter, system-ui, sans-serif; color: #f4f4f5">
  <div style="position: absolute; left: 0; top: 0">
    <dc-import name="TopBar" open="chat" hint-size="984px,40px"></dc-import>
  </div>

  <!-- the stage, narrower: the panel scales to fit (69 %), centred on the patch's colour -->
  <div style="position: absolute; left: 12px; top: 44px; width: 664px; height: 540px; background: #17141c; border-radius: 12px; overflow: hidden">
    <div style="position: absolute; left: 0; top: 83px; width: 960px; height: 540px; transform: scale(0.692); transform-origin: 0 0">
      <dc-import name="PatchArt" hint-size="960px,540px"></dc-import>
    </div>
  </div>
  <div style="position: absolute; left: 214px; top: 44px">
    <dc-import name="Notch" hint-size="260px,36px"></dc-import>
  </div>
  <div style="position: absolute; left: 568px; top: 54px">
    <dc-import name="ViewTabs" active="Surface" hint-size="98px,34px"></dc-import>
  </div>

  <!-- chat column, docked: as tall as the stage -->
  <div style="position: absolute; left: 684px; top: 44px; width: 288px; height: 540px; background: #0b0b0c; box-sizing: border-box; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 4px 10px 6px">
      <span style="font: 600 12.5px Inter">Chat</span>
      <div style="display: flex; gap: 4px; align-items: center">
        <span style="font: 500 10.5px Inter; color: #b4b4bc; background: rgba(255,255,255,0.05); border-radius: 6px; padding: 3px 8px">Main ▾</span>
        <button style="width: 24px; height: 24px; border: 0; border-radius: 6px; background: none; color: #b4b4bc; font: 500 14px Inter; padding: 0" aria-label="Close chat">×</button>
      </div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 4px 6px; overflow: hidden">
      <div style="align-self: flex-end; max-width: 210px; background: #26262b; border-radius: 10px 10px 2px 10px; padding: 8px 10px; font: 400 11.5px Inter; line-height: 1.45">Make the tape warmer, but keep the low end tight.</div>
      <div style="display: flex; align-items: center; gap: 8px; background: rgba(45,212,191,0.1); border-radius: 10px; padding: 8px 10px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 12h3l3-8 4 16 3-8h7"/></svg>
        <div><div style="font: 500 11px Inter">Listened · 10 s</div><div style="font: 400 10px Inter; color: #9b9ba3">bass DI, −14 LUFS, crest 13 dB</div></div>
      </div>
      <div style="max-width: 236px; font: 400 11.5px Inter; line-height: 1.5; color: #d4d4d8">Raised Character to 45 % (more tape drive, darker tone) and added a vari-mu on the lows below 150 Hz so the bottom stays put. The low end now peaks 2 dB lower.</div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <span style="font: 500 10.5px Inter; color: #d4d4d8; background: rgba(255,255,255,0.06); border-radius: 6px; padding: 3px 8px">Show changes</span>
        <span style="font: 500 10.5px Inter; color: #d4d4d8; background: rgba(255,255,255,0.06); border-radius: 6px; padding: 3px 8px">Undo</span>
      </div>
    </div>
    <div style="padding: 8px 4px 0 6px; display: flex; flex-direction: column; gap: 8px">
      <label style="font: 400 10px Inter; color: #9b9ba3">Message
        <textarea rows="2" style="display: block; margin-top: 4px; width: 100%; box-sizing: border-box; resize: none; background: #18181b; border: 0; border-radius: 10px; color: #d4d4d8; font: 400 11.5px Inter; padding: 8px 10px">Describe a change…</textarea>
      </label>
      <div style="display: flex; justify-content: space-between">
        <button style="border: 0; background: rgba(255,255,255,0.06); color: #d4d4d8; font: 500 11px Inter; border-radius: 7px; padding: 5px 10px">Listen 10 s</button>
        <button style="border: 0; background: #f4f4f5; color: #0b0b0c; font: 600 11px Inter; border-radius: 7px; padding: 5px 12px">Send</button>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 12px; top: 592px">
    <dc-import name="Dock" hint-size="960px,108px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":984,"height":708}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
