[package]
name = "shell_spike"
version = "0.0.1"
edition = "2024"
publish = false
description = "Throwaway spike: the v7 shell (Matte + Paper chat) in iced on nice-plug"

# Standalone on purpose: not part of the main workspace (heavy deps, throwaway code).
[workspace]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nice-plug = { version = "0.4.2", features = ["standalone"] }
nice-plug-iced = { version = "0.5.0", features = ["markdown", "svg", "canvas", "advanced"] }
# Only to switch on the `shader` widget (custom wgpu pipelines); same crate nice-plug-iced uses.
iced_widget = { version = "0.14", features = ["wgpu"] }
bytemuck = { version = "1", features = ["derive"] }
# For frame_stats (patched, see [patch.crates-io] below).
iced_wgpu = "0.14"

[profile.release]
debug = 1

# PATCH(scriptfx): iced_wgpu with frame timing (CPU + GPU timestamps), see ../../vendor/iced_wgpu/src/frame_stats.rs.
[patch.crates-io]
iced_wgpu = { path = "../../vendor/iced_wgpu" }
