<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" class="fill-bg"/>
  <text x="24" y="36" class="fill-text" font-family="sans-serif" font-size="18" font-weight="bold" letter-spacing="3">CLEAN GAIN</text>

  <!-- fader -->
  <rect x="146" y="46" width="8" height="208" rx="4" class="fill-panel stroke-edge"/>
  <g font-family="sans-serif" font-size="9" class="fill-dim">
    <text x="166" y="54">+12</text>
    <text x="166" y="121">0</text>
    <text x="166" y="254">-24</text>
  </g>
  <g id="fader_cap">
    <rect x="120" y="138" width="60" height="24" rx="4" class="fill-panel stroke-accent" stroke-width="2"/>
    <path d="M 128 150 L 172 150" class="stroke-accent" stroke-width="2"/>
  </g>
  <text id="gain_value" x="150" y="284" text-anchor="middle" class="fill-text" font-family="sans-serif" font-size="14">0.0 dB</text>

  <!-- meters (scaled around their bottom edge at y=250) -->
  <g id="meters">
    <rect x="250" y="50" width="22" height="200" class="fill-panel"/>
    <rect x="290" y="50" width="22" height="200" class="fill-panel"/>
    <rect id="meter_in_bar" x="250" y="50" width="22" height="200" class="fill-dim"/>
    <rect id="meter_out_bar" x="290" y="50" width="22" height="200" class="fill-accent"/>
    <use xlink:href="#tick" y="0"/>
  </g>
  <defs>
    <path id="tick" d="M 245 50 L 317 50" class="stroke-edge" stroke-dasharray="2 3"/>
  </defs>
  <text x="261" y="268" text-anchor="middle" class="fill-dim" font-family="sans-serif" font-size="10">IN</text>
  <text x="301" y="268" text-anchor="middle" class="fill-dim" font-family="sans-serif" font-size="10">OUT</text>
</svg>
