[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.89"

# Patched copies of crates.io dependencies (see vendor/*/PATCHES.md).
[patch.crates-io]
nice-plug = { path = "vendor/nice-plug" }
nice-plug-core = { path = "vendor/nice-plug-core" }
iced_wgpu = { path = "vendor/iced_wgpu" }
baseview = { path = "vendor/baseview" }
